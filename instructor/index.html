<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MADARABIC - بوابة المدرس</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'IBM Plex Sans Arabic', sans-serif; background-color: #FAF8F1; } </style>
</head>
<body class="flex h-screen overflow-hidden">
  <aside class="w-64 bg-[#022C22] text-white flex flex-col justify-between p-4">
    <div>
      <div class="text-2xl font-bold text-[#C8A951] mb-8 text-center">MADARABIC</div>
      <nav class="space-y-2">
        <a href="index.html" class="block px-4 py-2.5 rounded bg-[#006C35]">الرئيسية</a>
        <a href="courses.html" class="block px-4 py-2.5 rounded hover:bg-[#064E3B]">دوراتي المسندة</a>
        <a href="students.html" class="block px-4 py-2.5 rounded hover:bg-[#064E3B]">قائمة الطلاب</a>
        <a href="assignments.html" class="block px-4 py-2.5 rounded hover:bg-[#064E3B]">تصحيح الواجبات</a>
      </nav>
    </div>
    <button onclick="logout()" class="w-full py-2 bg-red-700 rounded font-bold text-sm">تسجيل الخروج</button>
  </aside>

  <main class="flex-1 p-8 overflow-y-auto">
    <h1 class="text-2xl font-bold text-[#064E3B] mb-6">مرحباً بك أستاذنا القدير</h1>

    <div class="bg-white p-6 rounded-xl border border-[#C8A951]/20 shadow-sm mb-6">
      <h2 class="text-lg font-bold text-[#064E3B] mb-4">إضافة درس جديد</h2>
      <form id="addLessonForm" class="space-y-3">
        <div class="grid grid-cols-2 gap-3">
          <input type="text" id="lesTitle" placeholder="عنوان الدرس" required class="p-2 border rounded">
          <input type="text" id="courseId" placeholder="رمز الدورة (CRS-xxx)" required class="p-2 border rounded">
        </div>
        <select id="skillType" class="w-full p-2 border rounded">
          <option value="LISTENING">مهارة الاستماع</option>
          <option value="SPEAKING">مهارة المحادثة والتحدث</option>
          <option value="READING">مهارة القراءة</option>
          <option value="WRITING">مهارة الكتابة</option>
        </select>
        <textarea id="lesContent" placeholder="محتوى الدرس والشرح النصي" class="w-full p-2 border rounded h-20"></textarea>
        <button type="submit" class="px-4 py-2 bg-[#064E3B] text-white rounded font-bold text-sm">حفظ ونشر الدرس</button>
      </form>
      <div id="lesMsg" class="mt-2 text-xs font-bold text-green-700 hidden"></div>
    </div>
  </main>

  <script src="../assets/js/config.js"></script>
  <script>
    document.getElementById("addLessonForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const res = await apiCall("saveLesson", {
        title: document.getElementById("lesTitle").value,
        courseId: document.getElementById("courseId").value,
        skillType: document.getElementById("skillType").value,
        content: document.getElementById("lesContent").value
      });
      const msg = document.getElementById("lesMsg");
      msg.classList.remove("hidden");
      msg.innerText = res.message;
    });
    function logout() { localStorage.clear(); window.location.href = "../login.html"; }
  </script>
</body>
</html>
