<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MADARABIC - إنشاء حساب جديد</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'IBM Plex Sans Arabic', sans-serif; background-color: #FAF8F1; } </style>
</head>
<body class="flex items-center justify-center min-h-screen py-10">
  <div class="w-full max-w-lg p-8 bg-white rounded-xl shadow-lg border border-[#C8A951]/20">
    <div class="text-center mb-6">
      <h1 class="text-3xl font-bold text-[#064E3B]">MADARABIC</h1>
      <p class="text-sm text-[#C8A951] mt-1">الانضمام إلى منصة تعليم اللغة العربية</p>
    </div>

    <form id="regForm" class="space-y-4">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">الاسم بالإنجليزية</label>
          <input type="text" id="fullName" required class="w-full p-2.5 border rounded-lg">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">الاسم بالعربية</label>
          <input type="text" id="arabicName" required class="w-full p-2.5 border rounded-lg">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">البريد الإلكتروني</label>
        <input type="email" id="email" required class="w-full p-2.5 border rounded-lg">
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">رقم الواتساب</label>
          <input type="text" id="phone" required class="w-full p-2.5 border rounded-lg">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">المستوى الأكاديمي</label>
          <select id="level" class="w-full p-2.5 border rounded-lg">
            <option value="A1">A1 - مبتدئ</option>
            <option value="A2">A2 - أساسي</option>
            <option value="B1">B1 - متوسط</option>
            <option value="B2">B2 - فوق المتوسط</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">الدولة</label>
          <input type="text" id="country" required class="w-full p-2.5 border rounded-lg">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">المدينة</label>
          <input type="text" id="city" required class="w-full p-2.5 border rounded-lg">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">كلمة المرور</label>
        <input type="password" id="password" required class="w-full p-2.5 border rounded-lg">
      </div>

      <button type="submit" class="w-full py-3 bg-[#064E3B] text-white rounded-lg font-bold hover:bg-[#006C35] transition">إنشاء الحساب</button>
    </form>
    
    <div id="msg" class="mt-4 text-center text-sm font-semibold hidden"></div>
    <div class="text-center mt-4 text-xs">
      لديك حساب بالفعل؟ <a href="login.html" class="text-[#006C35] font-bold">تسجيل الدخول</a>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script>
    document.getElementById("regForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg");
      const res = await apiCall("register", {
        fullName: document.getElementById("fullName").value,
        arabicName: document.getElementById("arabicName").value,
        email: document.getElementById("email").value,
        phone: document.getElementById("phone").value,
        level: document.getElementById("level").value,
        country: document.getElementById("country").value,
        city: document.getElementById("city").value,
        password: document.getElementById("password").value
      });

      msg.classList.remove("hidden");
      if (res.success) {
        msg.className = "mt-4 text-center text-sm font-semibold text-green-700";
        msg.innerText = "تم إنشاء الحساب بنجاح! جاري تحويلك للتسجيل...";
        setTimeout(() => window.location.href = "login.html", 1500);
      } else {
        msg.className = "mt-4 text-center text-sm font-semibold text-red-600";
        msg.innerText = res.message;
      }
    });
  </script>
</body>
</html>
