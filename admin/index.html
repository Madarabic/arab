<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MADARABIC - لوحة التحكم</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'IBM Plex Sans Arabic', sans-serif; background-color: #FAF8F1; }
  </style>
</head>
<body class="flex h-screen overflow-hidden">
  <!-- Sidebar -->
  <aside class="w-64 bg-[#022C22] text-white flex flex-col justify-between p-4">
    <div>
      <div class="text-2xl font-bold text-[#C8A951] mb-8 text-center">MADARABIC</div>
      <nav class="space-y-3">
        <a href="index.html" class="block px-4 py-2 rounded bg-[#006C35]">الرئيسية</a>
        <a href="students.html" class="block px-4 py-2 rounded hover:bg-[#064E3B]">الطلاب</a>
        <a href="instructors.html" class="block px-4 py-2 rounded hover:bg-[#064E3B]">المدرسون</a>
        <a href="courses.html" class="block px-4 py-2 rounded hover:bg-[#064E3B]">الدورات</a>
      </nav>
    </div>
    <button onclick="logout()" class="w-full py-2 bg-red-700 rounded font-bold">تسجيل الخروج</button>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 p-8 overflow-y-auto">
    <h1 class="text-3xl font-bold text-[#064E3B] mb-8">لوحة التحكّم الشاملة</h1>
    
    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
      <div class="bg-white p-6 rounded-xl border border-[#C8A951]/20 shadow-sm">
        <div class="text-gray-500 text-sm">إجمالي الطلاب</div>
        <div id="studentsCount" class="text-3xl font-bold text-[#064E3B] mt-2">-</div>
      </div>
      <div class="bg-white p-6 rounded-xl border border-[#C8A951]/20 shadow-sm">
        <div class="text-gray-500 text-sm">إجمالي المدرسين</div>
        <div id="instructorsCount" class="text-3xl font-bold text-[#064E3B] mt-2">-</div>
      </div>
      <div class="bg-white p-6 rounded-xl border border-[#C8A951]/20 shadow-sm">
        <div class="text-gray-500 text-sm">إجمالي البرامج</div>
        <div id="programsCount" class="text-3xl font-bold text-[#064E3B] mt-2">-</div>
      </div>
      <div class="bg-white p-6 rounded-xl border border-[#C8A951]/20 shadow-sm">
        <div class="text-gray-500 text-sm">إجمالي الدورات</div>
        <div id="coursesCount" class="text-3xl font-bold text-[#064E3B] mt-2">-</div>
      </div>
    </div>
  </main>

  <script src="../assets/js/config.js"></script>
  <script>
    async function loadDashboard() {
      const res = await apiCall("getDashboard", {}, "GET");
      if (res.success) {
        document.getElementById("studentsCount").innerText = res.data.studentsCount;
        document.getElementById("instructorsCount").innerText = res.data.instructorsCount;
        document.getElementById("programsCount").innerText = res.data.programsCount;
        document.getElementById("coursesCount").innerText = res.data.coursesCount;
      }
    }

    function logout() {
      localStorage.clear();
      window.location.href = "../login.html";
    }

    loadDashboard();
  </script>
</body>
</html>
