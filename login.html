<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MADARABIC - تسجيل الدخول</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'IBM Plex Sans Arabic', sans-serif; background-color: #FAF8F1; }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen">
  <div class="w-full max-w-md p-8 bg-white rounded-xl shadow-lg border border-[#C8A951]/20">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-[#064E3B]">MADARABIC</h1>
      <p class="text-sm text-[#C8A951] mt-2">العربية من المدينة إلى العالم</p>
    </div>
    
    <form id="loginForm" class="space-y-6">
      <div>
        <label class="block text-sm font-medium text-[#17201C] mb-2">البريد الإلكتروني</label>
        <input type="email" id="email" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:border-[#006C35]">
      </div>
      
      <div>
        <label class="block text-sm font-medium text-[#17201C] mb-2">كلمة المرور</label>
        <input type="password" id="password" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:border-[#006C35]">
      </div>

      <button type="submit" class="w-full py-3 bg-[#064E3B] text-white rounded-lg hover:bg-[#006C35] font-bold transition">تسجيل الدخول</button>
    </form>
    <div id="alertMsg" class="mt-4 text-center text-sm hidden"></div>
  </div>

  <script src="assets/js/config.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const alert = document.getElementById("alertMsg");
      alert.classList.add("hidden");

      const res = await apiCall("login", {
        email: document.getElementById("email").value,
        password: document.getElementById("password").value
      });

      if (res.success) {
        localStorage.setItem("MADARABIC_TOKEN", res.data.token);
        localStorage.setItem("MADARABIC_ROLE", res.data.role);

        if (res.data.role === "ADMIN") window.location.href = "admin/index.html";
        else if (res.data.role === "INSTRUCTOR") window.location.href = "instructor/index.html";
        else window.location.href = "student/index.html";
      } else {
        alert.innerText = res.message;
        alert.className = "mt-4 text-center text-sm text-red-600 block";
      }
    });
  </script>
</body>
</html>
