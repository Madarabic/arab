<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MADARABIC - التحقق من الشهادة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'IBM Plex Sans Arabic', sans-serif; background-color: #FAF8F1; } </style>
</head>
<body class="flex items-center justify-center min-h-screen">
  <div class="w-full max-w-lg p-8 bg-white rounded-xl shadow-lg border-2 border-[#C8A951] text-center">
    <h1 class="text-3xl font-bold text-[#064E3B]">MADARABIC</h1>
    <p class="text-xs text-[#C8A951] mt-1 font-bold">العربية من المدينة إلى العالم</p>
    <hr class="my-6 border-[#C8A951]/30">

    <div class="space-y-4">
      <div class="text-sm text-gray-500">شهادة إتمام دورة معتمدة</div>
      <div id="certStatus" class="text-lg font-bold text-green-700">✓ شهادة معتمدة وصالحة</div>
      <div class="p-4 bg-[#FAF8F1] rounded-lg border text-right space-y-2 text-sm">
        <div><span class="font-bold text-gray-700">اسم الطالب:</span> <span id="studentName">--</span></div>
        <div><span class="font-bold text-gray-700">اسم الدورة:</span> <span id="courseName">--</span></div>
        <div><span class="font-bold text-gray-700">رمز التوثيق:</span> <span id="certCode" class="font-mono text-xs">--</span></div>
      </div>
    </div>
  </div>
</body>
</html>
