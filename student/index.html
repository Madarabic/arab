<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MADARABIC - بوابة الطالب</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'IBM Plex Sans Arabic', sans-serif; background-color: #FAF8F1; } </style>
</head>
<body class="flex h-screen overflow-hidden">
  <aside class="w-64 bg-[#022C22] text-white flex flex-col justify-between p-4">
    <div>
      <div class="text-2xl font-bold text-[#C8A951] mb-8 text-center">MADARABIC</div>
      <nav class="space-y-2">
        <a href="index.html" class="block px-4 py-2.5 rounded bg-[#006C35]">الرئيسية</a>
        <a href="courses.html" class="block px-4 py-2.5 rounded hover:bg-[#064E3B]">دوراتي</a>
        <a href="assignments.html" class="block px-4 py-2.5 rounded hover:bg-[#064E3B]">واجباتي</a>
        <a href="certificates.html" class="block px-4 py-2.5 rounded hover:bg-[#064E3B]">شهاداتي</a>
      </nav>
    </div>
    <button onclick="logout()" class="w-full py-2 bg-red-700 rounded font-bold text-sm">تسجيل الخروج</button>
  </aside>

  <main class="flex-1 p-8 overflow-y-auto">
    <div class="flex justify-between items-center mb-8">
      <h1 class="text-2xl font-bold text-[#064E3B]">أهلاً بك في منصة MADARABIC</h1>
      <span class="px-3 py-1 bg-[#C8A951]/20 text-[#064E3B] border border-[#C8A951] rounded-full text-xs font-bold">حساب طالب</span>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
      <div class="bg-white p-6 rounded-xl border border-[#C8A951]/20 shadow-sm">
        <div class="text-xs text-gray-500">الدورات المسجل بها</div>
        <div id="myCoursesCount" class="text-2xl font-bold text-[#064E3B] mt-2">0</div>
      </div>
      <div class="bg-white p-6 rounded-xl border border-[#C8A951]/20 shadow-sm">
        <div class="text-xs text-gray-500">الواجبات المعلقة</div>
        <div id="pendingAssignments" class="text-2xl font-bold text-[#064E3B] mt-2">0</div>
      </div>
      <div class="bg-white p-6 rounded-xl border border-[#C8A951]/20 shadow-sm">
        <div class="text-xs text-gray-500">معدل الانجاز العام</div>
        <div id="overallProgress" class="text-2xl font-bold text-[#006C35] mt-2">0%</div>
      </div>
    </div>

    <div class="bg-white p-6 rounded-xl border border-[#C8A951]/20 shadow-sm">
      <h2 class="text-lg font-bold text-[#064E3B] mb-4">الدورات المتاحة للتعلم</h2>
      <div id="coursesList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>
  </main>

  <script src="../assets/js/config.js"></script>
  <script>
    async function initStudentPortal() {
      const res = await apiCall("getCourses", {}, "GET");
      if (res.success) {
        const container = document.getElementById("coursesList");
        document.getElementById("myCoursesCount").innerText = res.data.length;
        container.innerHTML = res.data.map(c => `
          <div class="border p-4 rounded-lg flex justify-between items-center bg-[#FAF8F1]/50">
            <div>
              <h3 class="font-bold text-[#064E3B]">${c.courseName}</h3>
              <p class="text-xs text-gray-600">${c.description || 'دورة تعليم اللغة العربية'}</p>
            </div>
            <a href="course.html?id=${c.courseId}" class="px-3 py-1.5 bg-[#006C35] text-white text-xs rounded font-bold">دخول الدورة</a>
          </div>
        `).join('');
      }
    }
    function logout() { localStorage.clear(); window.location.href = "../login.html"; }
    initStudentPortal();
  </script>
</body>
</html>
